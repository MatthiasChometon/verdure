# verdure — full-stack PUBLIC deployment (prod).
#
# The public-facing stack: Caddy terminates HTTPS (auto Let's Encrypt for
# $DOMAIN) and routes back + front on a single origin; everything else stays
# internal. Mail goes out for real via Gmail SMTP and ComfyUI runs alongside on
# the GPU. Source trees are baked into the images (not bind-mounted), the back
# runs the compiled server and the front serves its built Nitro output.
#
# To run these same prod images locally instead (Mailpit, direct ports, GPU on
# demand, trimmed resources), use docker-compose.images.yml.
#
#   DOMAIN=example.com docker compose -f docker-compose.prod.yml up --build
#
# The front builds once on first boot (it needs the live back for codegen); its
# node_modules and .output live in volumes, so remove them to force a rebuild:
#   docker compose -f docker-compose.prod.yml down -v

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: verdure
      POSTGRES_PASSWORD: verdure
      POSTGRES_DB: verdure
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verdure -d verdure']
      interval: 5s
      timeout: 5s
      retries: 20

  # Internal only — the back reads/writes it over the network and serves images
  # itself (/images), so the object store is never exposed publicly.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: verdure
      MINIO_ROOT_PASSWORD: verdure-secret
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 verdure verdure-secret; do sleep 1; done;
      mc mb --ignore-existing local/plants;
      exit 0;
      "

  back:
    build:
      context: ./back
      target: prod
    image: verdure-back:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 3000
      DATABASE_URL: postgres://verdure:verdure@postgres:5432/verdure
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: plants
      S3_ACCESS_KEY: verdure
      S3_SECRET_KEY: verdure-secret
      S3_FORCE_PATH_STYLE: 'true'
      FRONT_URL: https://${DOMAIN:-localhost}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://${DOMAIN:-localhost}/auth/google/callback
      # Real delivery via Gmail SMTP. Fill MAIL_USER (your Gmail address) and
      # MAIL_PASS (a Google "app password", not your login password) in .env.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-verdure <${MAIL_USER:-noreply@verdure.local}>}
      AI_API_URL: http://ai-api:8000
      VISION_URL: http://ai-api:8000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/graphql', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  front:
    build:
      context: ./front
      target: prod
    image: verdure-front:prod
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    environment:
      PORT: 3000
      # SSR reaches the back internally; the browser reaches it on the SAME
      # origin (Caddy routes /graphql, /auth, /uploads, /images to the back).
      GQL_HOST: http://back:3000/graphql
      NUXT_PUBLIC_API_SAME_ORIGIN: 'true'
    # .output is NOT a volume: `nuxt build` rmdir's and recreates it, which fails
    # on a mount point (EBUSY). It lives in the container layer — persists across
    # restarts, rebuilt on recreate.
    volumes:
      - front-node-modules:/app/node_modules

  # The only public service: terminates HTTPS (auto Let's Encrypt for $DOMAIN)
  # and routes to back/front on one origin. Everything else stays internal.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - back
      - front
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./devops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  comfyui:
    build: ./ai/comfyui
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      VERDURE_MODELS_DIR: /opt/ComfyUI/models/embeddings
    volumes:
      - comfyui-models:/opt/ComfyUI/models
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8188/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 40
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Internal only (no published port): reachable solely by the back over the
  # Docker network at http://ai-api:8000. comfyui is internal too.
  ai-api:
    build: ./ai/api
    restart: unless-stopped
    depends_on:
      comfyui:
        condition: service_healthy
    environment:
      COMFY_URL: http://comfyui:8188

volumes:
  postgres-data:
  minio-data:
  front-node-modules:
  comfyui-models:
  hf-cache:
  caddy-data:
  caddy-config:
