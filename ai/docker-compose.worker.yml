# Bring-your-own-GPU worker overlay. Run it alongside the AI bundle so a local
# ComfyUI processes YOUR account's plant-recognition jobs from the hosted app:
#
#   cp .env.worker.example .env   # then set VERDURE_BACK_URL
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d
#
# On first launch the worker opens a page for you to confirm the connection —
# no token to copy. The paired token is kept in the `worker-token` volume so it
# survives restarts. The worker only makes OUTBOUND calls to the back.
services:
  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      VERDURE_BACK_URL: ${VERDURE_BACK_URL}
      # Optional pre-set token; empty means "pair on first launch".
      VERDURE_WORKER_TOKEN: ${VERDURE_WORKER_TOKEN:-}
      AI_API_URL: 'http://api:8000'
      VERDURE_TOKEN_FILE: '/data/worker-token'
    volumes:
      - worker-token:/data

volumes:
  worker-token:
