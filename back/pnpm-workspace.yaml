allowBuilds:
  '@apollo/protobufjs': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
# Transitive advisories reported by `pnpm audit --prod`, one entry per package (the highest
# patched version covers the older ranges). Delete an entry when its parent resolves the patched
# version by itself, and keep the deletion if `pnpm audit --prod` stays clean. Owner: the
# maintainer (post-campaign), at each dependency update.
overrides:
  # GHSA-q7qp-rjg7-q26m, GHSA-wc9g-mqfw-jrwm, GHSA-535w-7cp7-47q4, GHSA-72gw-mp4g-v24j (multer 2.5.0
  # fixes them all). Parent: @nestjs/platform-express, which accepts any multer 2.x.
  multer@<2.5.0: ^2.5.0
  # GHSA-7mx3-vvmw-hjmv, GHSA-c4qx-w738-7hr3. Parents: @nestjs/graphql and @apollo/server >
  # @graphql-tools/merge.
  '@graphql-tools/utils@<=12.0.1': ^12.0.2
  # Not an advisory: @nestjs/schedule 6.1.3 requires cron 4.4.0 exactly, and a second copy (4.4.2,
  # from the range our own import resolves to) breaks its types in domain/wateringReminder/scheduler.ts.
  # Remove when @nestjs/schedule accepts the latest cron (then keep a plain range in package.json).
  cron: 4.4.0
