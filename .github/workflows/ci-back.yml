name: CI back

# Runs in parallel with the front workflow (separate runner). The o2switch cron
# deploys the back only once this workflow is green for the commit (it checks the
# public check-run status before pulling). The prod DB is unreachable from a
# runner, so migrations against PROD happen in the deploy (devops/ops/deploy.sh); here we
# migrate a throwaway test DB to run the e2e suite.
on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/ci-back.yml'
  pull_request:
    paths:
      - 'back/**'
  workflow_dispatch:

concurrency:
  group: ci-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: verdure
          POSTGRES_PASSWORD: verdure
          POSTGRES_DB: verdure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verdure -d verdure"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    env:
      # The e2e suite boots the Nest app, which getOrThrow's these. Test values —
      # DATABASE_URL is set to the test DB by vitest.config.e2e.ts.
      TEST_DATABASE_URL: postgres://verdure:verdure@localhost:5432/verdure_test
      JWT_SECRET: test-jwt-secret
      FRONT_URL: http://localhost:3666
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      STORAGE_DRIVER: disk
      STORAGE_DIR: /tmp/verdure-storage
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: plants
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_FORCE_PATH_STYLE: 'true'
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      MAIL_SECURE: 'false'
      MAIL_FROM: verdure <noreply@verdure.local>
      AI_API_URL: http://localhost:8000
      VISION_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # back/package.json has no packageManager field, so pin the version here.
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: back/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        # The lint script has --fix (dev convenience); in CI run eslint read-only.
        run: pnpm exec eslint "{domain,infrastructure}/**/*.ts" "main.ts" "app.module.ts" "drizzle.config.ts"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare test database
        run: |
          PGPASSWORD=verdure psql -h localhost -U verdure -d verdure -c "CREATE DATABASE verdure_test" || true
          DATABASE_URL="$TEST_DATABASE_URL" pnpm exec drizzle-kit migrate

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
