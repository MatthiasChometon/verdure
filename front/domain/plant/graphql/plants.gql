query plants(
  $search: String
  $sort: PlantSortField
  $direction: SortDirection
  $genus: String
  $hasImage: Boolean
  $petSafe: Boolean
  $lang: String
  $limit: Int
  $offset: Int
) {
  plants(
    search: $search
    sort: $sort
    direction: $direction
    genus: $genus
    hasImage: $hasImage
    petSafe: $petSafe
    limit: $limit
    offset: $offset
  ) {
    items {
      id
      name
      species
      description
      imageUrl
      wateringIntervalSummerDays
      wateringIntervalWinterDays
      lastWateredOn
      nextDueOn
      winterRest
      safety(lang: $lang) {
        level
        note
      }
    }
    total
    semanticPending
  }
}
