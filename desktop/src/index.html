<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>verdure</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="head">
        <span id="dot" class="dot down" aria-hidden="true"></span>
        <div>
          <h1>verdure</h1>
          <p id="state" class="state">Arrêté</p>
        </div>
      </header>

      <div class="actions">
        <button id="btn-start" class="btn primary">Démarrer</button>
        <button id="btn-stop" class="btn">Arrêter</button>
        <button id="btn-open" class="btn ghost" disabled>Ouvrir l'application</button>
      </div>

      <p class="hint">
        L'IA démarre toute seule à la première identification (~1 min à froid),
        puis s'arrête après 15 min d'inactivité.
      </p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
