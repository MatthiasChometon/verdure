[package]
name = "verdure-desktop"
version = "0.1.0"
edition = "2021"
description = "Tray launcher for verdure (local prod) with a live status light."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
# Thin LTO: nearly the size win of fat LTO without the heavy, slow final link.
lto = "thin"
strip = true
